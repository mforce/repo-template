# Dependabot version updates.
#
# HOW THIS RELATES TO THE CI GATES — they do different halves of the job.
#   - The gates in ci.yml ENFORCE: a known-vulnerable dependency fails the build,
#     so it cannot be ignored or merged past.
#   - Dependabot PROPOSES: it opens the PR that actually fixes the thing the gate
#     is blocking on, and (with Dependabot alerts enabled in repo settings) flags
#     a newly published advisory the day it lands rather than whenever someone
#     next opens a PR.
# Neither replaces the other. Without the gates a vulnerable dep still merges
# green; without Dependabot someone hand-writes every bump.
#
# Updates are GROUPED so routine version churn arrives as a few reviewable PRs
# rather than one per package. Security fixes are deliberately left OUT of the
# groups (Dependabot's default): an advisory fix should arrive as its own PR that
# can be read and merged on its own, not buried in a bulk bump.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns: ["*"]
        # TODO(template) exclude any action that holds write permissions and
        # ships a bundled `dist/`. A SHA pin only protects you up to the moment
        # someone rubber-stamps the bump that moves it, and a bundled dist rolled
        # into a routine grouped PR is the exact shape of the 2025-03 tj-actions
        # incident. Keep such bumps standalone so they get read on their own.
        exclude-patterns:
          - "googleapis/release-please-action"
          - "actions/create-github-app-token"

