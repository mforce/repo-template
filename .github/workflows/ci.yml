# CI — runs on every PR and every push to main.
#
# TODO(template:ci-overview) fill in the build-and-test job and delete the ecosystem blocks
# you do not use. Keep the job count low: every job is billed per run and read by
# a human on every red. Add a job when something it would have caught actually
# happens, not because it is good practice.
#
# ACTION PINNING. Third-party actions are pinned to a full commit SHA with a
# trailing `# vX.Y.Z` comment — never a mutable tag. Tag-retargeting is a live
# supply-chain attack shape (tj-actions/changed-files 2025-03,
# aquasecurity/trivy-action 2026-03): with a tag you review one thing and run
# another. `actions/*` and `github/*` may keep major-version tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # TODO(template:ci-build-and-test) toolchain setup, restore, build, test.
      #
      # If your ecosystem has lock files, restore in LOCKED mode — a stale lock
      # must fail the run rather than silently resolving to different versions
      # than the ones a human reviewed.
      #   npm ci                                   (not `npm install`)
      #   dotnet restore --locked-mode
      #   pip install --require-hashes -r ...
      #
      # THE PLACEHOLDER DISARMS ITSELF. A stub that always fails makes this
      # repo's own CI permanently red, which trains everyone to ignore the red
      # — including on the gates that mean something. A stub that always passes
      # is worse: a project can ship with a vacuously green build job.
      #
      # So the stub is keyed to TEMPLATE-SETUP.md, whose final instruction is to
      # delete it. While that file exists the repo is admittedly un-set-up and
      # this warns; once it is gone the repo claims to be set up, and an
      # unfilled build step is a real defect that fails the run.
      - name: Build and test
        run: |
          set -eu
          if [ -f TEMPLATE-SETUP.md ]; then
            echo "::warning title=Build step not implemented::ci.yml still carries the template placeholder instead of a real build. It passes while TEMPLATE-SETUP.md exists; deleting that file (its opening instruction) makes this step fail until you replace it."
            exit 0
          fi
          echo "::error title=Build step not implemented::TEMPLATE-SETUP.md is gone, so this repo is set up — but ci.yml still carries the placeholder build step. Replace it with the real build and test commands."
          exit 1

      # Vulnerability gate over the whole dependency tree. Fails closed: an
      # unreadable or error-shaped report is exit 2, not "clean". `|| true` on
      # the audit command is deliberate — the exit code carries no information we
      # want, the parsed report does — and it is safe only because the gate
      # validates the report SHAPE before trusting an empty finding list.
      #
      # TODO(template:ci-audit-ecosystems) enable the ecosystems you use; delete the rest.
      #
      # - name: Audit npm production dependencies
      #   working-directory: web
      #   run: |
      #     npm audit --json --omit=dev > audit.json || true
      #     node ../.github/scripts/vuln-gate.mjs --ecosystem npm --level high < audit.json
      #
      # - name: Audit NuGet dependencies
      #   run: |
      #     dotnet list package --vulnerable --include-transitive \
      #       --format json --output-version 1 > audit.json || true
      #     node .github/scripts/vuln-gate.mjs --ecosystem nuget --level high < audit.json

      - name: Test the vulnerability gate itself
        run: node --test .github/scripts/*.test.mjs

  # PR-only: fails when a PR ADDS a dependency with a known vulnerability, before
  # it lands on main. Complements the audit gates above (which score the whole
  # tree) by scoring the DIFF, so a newly introduced bad dep is named in the PR.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # dependency-review needs the repo's Dependency graph — a one-time repo
      # setting no commit can supply. It is not reachable from a workflow, but it
      # IS reachable from a maintainer's CLI: `gh api -X PUT
      # repos/<owner>/<repo>/vulnerability-alerts` turns it on as a side effect
      # of enabling Dependabot alerts (see TEMPLATE-SETUP.md step 4).
      # Probe for it and branch on the HTTP status: only a definitive
      # graph-disabled response (403/404) skips the review — with a loud warning
      # naming the setting, so the gate self-activates on the next PR once the
      # toggle is on. A transient or unexpected status does NOT skip; the review
      # runs and surfaces the real error rather than silently disabling the gate.
      - name: Check the Dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code="$(gh api "repos/$REPO/dependency-graph/sbom" --silent -i 2>/dev/null \
            | awk 'toupper($1) ~ /^HTTP/ {print $2; exit}')"
          case "$code" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT" ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Dependency review inactive::Enable the Dependency graph at Settings → Advanced Security → Dependency graph; this gate activates automatically once it is on." ;;
            *)
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=Dependency graph probe inconclusive::sbom probe returned '${code:-no response}'; running dependency-review anyway so a real error is not masked." ;;
          esac

      # Same source of truth as the audit gates: the live (unexpired) GHSA ids in
      # security-exceptions.json become this action's allowlist, so the two gates
      # can never disagree about what is currently excepted. emitAllowlist yields
      # only bare, canonical GHSA ids; `tr -d` strips any stray newline as
      # defence in depth, so a single value can never forge a second
      # GITHUB_OUTPUT record.
      - name: Compute allowlist from security exceptions
        if: steps.graph.outputs.available == 'true'
        id: allow
        run: |
          ghsas="$(node .github/scripts/vuln-gate.mjs --emit-allowlist | tr -d '\r\n')"
          printf 'ghsas=%s\n' "$ghsas" >> "$GITHUB_OUTPUT"

      - name: Review dependency changes
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-ghsas: ${{ steps.allow.outputs.ghsas }}
