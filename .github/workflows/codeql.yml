# CodeQL — static analysis, ADVISORY.
#
# Deliberately not a merge gate. CodeQL's false-positive rate on application code
# is high enough that gating on it trains people to click through, which costs
# you the signal from every other gate too. Read the alerts; fix the real ones.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # TODO(template) the languages you actually ship. Note that
        # `actions` scans your own workflow files — worth keeping whatever
        # else is here.
        language: ["actions"]
        # e.g. ["actions", "csharp", "javascript-typescript", "python"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}

      # TODO(template) compiled languages (csharp, java, go, c-cpp) need a build
      # between init and analyze. Add `github/codeql-action/autobuild@v4`, or an
      # explicit build step when autobuild cannot work it out.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
