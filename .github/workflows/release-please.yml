# Release automation.
#
# WHAT IT DOES. On every push to main, release-please reads the conventional
# commits since the last release and maintains a standing "Release vX.Y.Z" PR
# holding the changelog and version bump. Merging that PR drafts the GitHub
# release.
#
# THE RELEASE STAYS A DRAFT. GitHub withholds the git tag for a draft release,
# so if you add a publish/promote step (see
# docs/decisions/002-release-and-publish.md) a failed publish leaves no version
# tag pointing at nothing. With no publish step, undraft it manually or set
# `"draft": false` in release-please-config.json.
#
# IDLE UNTIL NAMED. While release-please-config.json still carries the template's
# placeholder package name, this job reports and stops. Running it on an
# un-set-up repo pushes a release branch and then fails on PR creation, which is
# a red on the first push to main that no branch can fix. Naming the package
# (TEMPLATE-SETUP.md section 3) switches it on — do the token setup below first.
#
# TOKEN. GITHUB_TOKEN cannot open a PR unless "Allow GitHub Actions to create and
# approve pull requests" is on (Settings → Actions → General → Workflow
# permissions), and the PRs it does open get NO CI run — so the release PR would
# merge unverified. A GitHub App token avoids both. It is optional here: set the
# two secrets and the App path is used, otherwise it falls back to GITHUB_TOKEN
# with the caveats above.
#
# If you use the App: `permission-*` downscoping is MANDATORY. Omitting those
# inputs mints a token carrying the union of every grant the App holds, in every
# repo it is installed on — silently.
name: Release please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # secrets are not available in `if:` expressions, so surface the presence
      # of the client id through env, which is.
      APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    steps:
      - name: Read the release config
        uses: actions/checkout@v7
        with:
          # Both files the step below reads. Omitting one makes its `[ -f ]` test
          # false at runtime with nothing to see locally.
          sparse-checkout: |
            release-please-config.json
            TEMPLATE-SETUP.md
          sparse-checkout-cone-mode: false

      # Three states, and workflows.test.mjs pins which branch does what — the
      # literals alone can all survive a gate that is inverted or missing a case.
      - name: Is the package named yet?
        id: named
        run: |
          set -eu
          if ! grep -q 'TODO-template-package-name' release-please-config.json; then
            echo "named=true" >> "$GITHUB_OUTPUT"
          elif [ -f TEMPLATE-SETUP.md ]; then
            echo "named=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release automation not implemented::release-please-config.json still holds the template's placeholder package name, so no release PR was opened. Name the package (TEMPLATE-SETUP.md section 3) to switch this on, and set the token up first or the next run fails on PR creation."
          else
            echo "::error title=Release automation not implemented::TEMPLATE-SETUP.md is gone, so this repo claims to be set up, but release-please-config.json still holds the template's placeholder package name. Name the package, or drop the release part with scripts/setup.sh."
            exit 1
          fi

      - name: Mint a GitHub App token
        id: app-token
        if: steps.named.outputs.named == 'true' && env.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Downscope. Never omit these.
          permission-contents: write
          permission-pull-requests: write

      - name: Warn when falling back to GITHUB_TOKEN
        if: steps.named.outputs.named == 'true' && env.APP_CLIENT_ID == ''
        run: |
          echo "::warning title=No release App configured::Using GITHUB_TOKEN. The release PR will get no CI run, and PR creation needs 'Allow GitHub Actions to create and approve pull requests' enabled in repo settings. Set RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY to use a GitHub App instead."

      - name: Run release-please
        id: release
        if: steps.named.outputs.named == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # TODO(template) if you publish artifacts, gate them on this output and
      # read docs/decisions/002-release-and-publish.md first — in particular:
      # promotion is a retag of the reviewed bytes, never a rebuild.
      - name: Report
        if: steps.named.outputs.named == 'true'
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "Drafted release $TAG."
          else
            echo "No release this run; the release PR (if any) was refreshed."
          fi
