# Weekly dependency audit.
#
# WHY THIS EXISTS SEPARATELY FROM CI. The CI gates only run when someone opens a
# PR. An advisory published against a dependency you already ship is not caught
# by anything until the next PR happens to touch the repo — which on a quiet
# week is never. This run is the clock.
#
# It uses the SAME gate and the SAME exceptions file as CI, so the two can never
# disagree about what is currently excepted.
name: Security audit

on:
  schedule:
    # Monday 06:00 UTC. Cron on a schedule trigger runs against the default
    # branch only, which is what you want here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # TODO(template) toolchain setup + the same audit steps as ci.yml.
      # Keep them identical; a scheduled gate that is weaker than the PR gate
      # produces a green Monday and a red Tuesday for the same tree.
      #
      # Keyed to TEMPLATE-SETUP.md, exactly like ci.yml's `build-and-test`
      # placeholder, and for the reason ADR 000 gives: a red check nobody can fix
      # from a branch is worse than a missing check, because it teaches everyone
      # to ignore red — and that habit does not stay confined to the check that
      # earned it. An unconditional `exit 1` here fails EVERY Monday on a fresh
      # clone, on a schedule nobody opened a PR to trigger, for a reason no
      # change can address until the repo has a stack at all.
      #
      # So: warn while the repo is admittedly un-set-up, fail once it claims to
      # be set up. The two placeholders must keep behaving the same way; if you
      # change one, change the other.
      - name: Audit
        run: |
          set -eu
          if [ -f TEMPLATE-SETUP.md ]; then
            echo "::warning title=Weekly audit not implemented::security-audit.yml still carries the template placeholder instead of the real audit steps. It passes while TEMPLATE-SETUP.md exists; deleting that file, which TEMPLATE-SETUP.md tells you to do, makes this step fail until you replace it."
            exit 0
          fi
          echo "::error title=Weekly audit not implemented::TEMPLATE-SETUP.md is gone, so this repo is set up — but security-audit.yml still carries the placeholder. Replace it with the same vuln-gate steps ci.yml runs."
          exit 1
